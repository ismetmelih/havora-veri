name: Model haritalari

# İş bir kez başlayınca ~5,5 saat açık kalır ve 15 dakikada bir yeni veri arar (calis.sh).
# Zamanlanmış tetikleme yalnızca işi yeniden başlatmak için; GitHub bunu geciktirse de veri akışı kesilmez.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Uret ve yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash calis.sh
