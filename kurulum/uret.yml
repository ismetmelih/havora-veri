name: Model haritalari

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Onceki veriler
        run: git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}" out || mkdir -p out

      - name: Uret
        run: python uret.py

      - name: Yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          if [ -d .git ] && [ -z "$(git status --porcelain -- '*/meta.json')" ]; then
            echo "Yeni model kosusu yok"; exit 0
          fi
          rm -rf .git
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Model verileri $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" gh-pages
