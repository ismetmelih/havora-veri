name: Yildirim dene

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.0.2 h5py==3.12.1
      - name: Son paketin yapisi
        env:
          EUMETSAT_KEY: ${{ secrets.EUMETSAT_KEY }}
          EUMETSAT_SECRET: ${{ secrets.EUMETSAT_SECRET }}
        run: python yildirim.py --dene
